name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  # Relance automatique quand le README ou ce workflow changent.
  # Les commits du bot ne touchent que les SVG, donc pas de boucle.
  push:
    branches: [main]
    paths:
      - "README.md"
      - "README.fr.md"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

# Un seul run à la fois : évite que deux runs se marchent dessus au moment du push
concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT_TOKEN }}

      # 📊 Carte Stats
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=ProGen18&show_icons=true&theme=tokyonight&include_all_commits=true&count_private=true&hide_border=true&show=reviews,prs_merged,prs_merged_percentage
          path: profile/stats.svg
          token: ${{ secrets.PAT_TOKEN }}

      # 💻 Carte Top Languages
      - name: Generate top langs card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=ProGen18&layout=compact&langs_count=8&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_TOKEN }}

      # 📌 Cartes des repos mis en avant
      - name: Pin Trust_Game
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=ProGen18&repo=Trust_Game&theme=tokyonight&hide_border=true&show_owner=false
          path: profile/pin-trust-game.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Pin Snake_AI
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=ProGen18&repo=Snake_AI&theme=tokyonight&hide_border=true&show_owner=false
          path: profile/pin-snake-ai.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Pin TripAdvisor
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=ProGen18&repo=TripAdvisor&theme=tokyonight&hide_border=true&show_owner=false
          path: profile/pin-tripadvisor.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Pin wheel_survey
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=ProGen18&repo=wheel_survey&theme=tokyonight&hide_border=true&show_owner=false
          path: profile/pin-wheel-survey.svg
          token: ${{ secrets.PAT_TOKEN }}

      # 🐍 Serpent qui mange les contributions
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ProGen18
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🔥 Streak : on télécharge la carte depuis l'instance publique
      # et on ne remplace l'ancienne version que si on reçoit bien un SVG.
      # Si le service est en panne, le profil garde la dernière carte valide.
      - name: Fetch streak card
        run: |
          fetch() {
            url="$1"; out="$2"
            if curl -sfL --max-time 60 "$url" -o "$out.tmp" && grep -q "<svg" "$out.tmp"; then
              mv "$out.tmp" "$out"
              echo "OK  $out"
            else
              rm -f "$out.tmp"
              echo "::warning::Échec pour $out, on garde l'ancienne version"
            fi
          }
          fetch "https://streak-stats.demolab.com/?user=ProGen18&theme=tokyonight&hide_border=true" profile/streak.svg

      # 🏅 Trophées : générés directement dans le run (l'instance publique Vercel est hors service)
      - name: Generate trophies card
        uses: ryo-ma/github-profile-trophy@master
        continue-on-error: true
        with:
          username: ProGen18
          output_path: profile/trophies.svg
          token: ${{ secrets.PAT_TOKEN }}
          theme: tokyonight

      # 🧾 Cartes « Profile Summary » (contributions, langages, heures de commit)
      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          USERNAME: ProGen18
          BRANCH_NAME: main
          UTC_OFFSET: 1
          THEME: tokyonight
          AUTO_PUSH: false

      # 📤 Commit et push les SVGs
      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg profile-summary-card-output
          git commit -m "Update README cards" || exit 0
          # Si main a bougé pendant le run (ex. modif du README), on se recale avant de pousser
          git pull --rebase -X theirs origin main
          git push
