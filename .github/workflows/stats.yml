name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      # 📊 Carte Stats
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=ProGen18&show_icons=true&theme=tokyonight&include_all_commits=true&count_private=true&hide_border=true&show=reviews,prs_merged,prs_merged_percentage
          path: profile/stats.svg
          token: ${{ secrets.PAT_TOKEN }}

      # 💻 Carte Top Languages
      - name: Generate top langs card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=ProGen18&layout=compact&langs_count=8&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_TOKEN }}

      # 📌 Cartes des repos mis en avant
      - name: Pin Trust_Game
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=ProGen18&repo=Trust_Game&theme=tokyonight&hide_border=true&show_owner=false
          path: profile/pin-trust-game.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Pin Snake_AI
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=ProGen18&repo=Snake_AI&theme=tokyonight&hide_border=true&show_owner=false
          path: profile/pin-snake-ai.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Pin TripAdvisor
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=ProGen18&repo=TripAdvisor&theme=tokyonight&hide_border=true&show_owner=false
          path: profile/pin-tripadvisor.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Pin wheel_survey
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=ProGen18&repo=wheel_survey&theme=tokyonight&hide_border=true&show_owner=false
          path: profile/pin-wheel-survey.svg
          token: ${{ secrets.PAT_TOKEN }}

      # 🐍 Serpent qui mange les contributions
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ProGen18
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 📤 Commit et push les SVGs
      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
